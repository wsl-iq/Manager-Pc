<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Zombie Game </title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .control-wrapper {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
      z-index: 1000;
      opacity: 0.9;
    }
    .wasd {
      display: grid;
      grid-template-columns: repeat(3, 45px);
      grid-template-rows: repeat(2, 45px);
      gap: 5px;
      justify-content: center;
      align-items: center;
    }
    .key {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid;
      border-radius: 10px;
      background-color: rgba(0,0,1,2.10);
      transition: all 0.2s ease;
    }
    .key.w { color: #00f; border-color: #00f; box-shadow: 0 0 6px #00f; grid-column: 2; grid-row: 1; }
    .key.a { color: #ff0; border-color: #ff0; box-shadow: 0 0 6px #ff0; grid-column: 1; grid-row: 2; }
    .key.s { color: #f00; border-color: #f00; box-shadow: 0 0 6px #f00; grid-column: 2; grid-row: 2; }
    .key.d { color: #0f0; border-color: #0f0; box-shadow: 0 0 6px #0f0; grid-column: 3; grid-row: 2; }

    .key:active {
      box-shadow: 0 0 15px #fff;
      transform: scale(1.05);
      background-color: rgba(255,255,255,0.1);
    }

    .mouse {
      margin-top: 12px;
    }
    .mouse img {
      width: 60px;
      height: auto;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.8));
    }
  </style>
</head>
<body>
<!-- partial:index.partial.html -->
<div class="container">
  <div class="mini-map"></div>
  <div class="main-screen">
    <div class="start-button">LOADING...</div>
  </div>
  <div class="control-wrapper">
    <div class="wasd">

      <div class="key w">W</div>
      <div class="key a">A</div>
      <div class="key s">S</div>
      <div class="key d">D</div>
    </div>
    <div class="mouse">
      <img src="mouse.png" alt="Mouse Illustration">
    </div>
  </div>
</div>

</body>

class Keyboard {
  constructor() {
    this._pressedKeys = {};

    this._onKeyDownBound = this._onKeyDown.bind(this);
    this._onKeyUpBound = this._onKeyUp.bind(this);

    window.addEventListener("keydown", this._onKeyDownBound);
    window.addEventListener("keyup", this._onKeyUpBound);
  }

  isPressed(key) {
    return this._pressedKeys[key];
  }

  destruct() {
    window.removeEventListener("keydown", this._onKeyDownBound);
    window.removeEventListener("keyup", this._onKeyUpBound);
  }

  _onKeyDown(event) {
    this._pressedKeys[event.keyCode] = true;
  }

  _onKeyUp(event) {
    this._pressedKeys[event.keyCode] = false;
  }}
;

class FogRenderer {
  constructor(context) {
    this._context = context;

    this._stage2DRendererFramebuffer = new AGL.Framebuffer();
    this._filterRendererFramebuffer = new AGL.Framebuffer();

    this._stage2DRenderer = new AGL.Stage2D({
      config: {
        context: this._context,
        contextAttributes: {
          alpha: true } },


      maxBatchItems: 1 });

    this._stage2DRenderer.clearColor.set(0, 0, 0, 0);
    this._stage2DRenderer.clearBeforeRender = true;

    this._fogImage = new AGL.Image(AGL.Texture.loadImage(FOG_TEXTURE));

    this._fogImage.textureProps.width = 2;
    this._fogImage.textureProps.height = 1.625;
    this._fogImage.tintType = AGL.Image.TintType.NORMAL;
    this._fogImage.props.alpha = 0.9;
    this._fogImage.color.set(.05, .15, .2, .95);
    this._stage2DRenderer.container.addChild(this._fogImage);

    this._displacementFilter = new AGL.DisplacementFilter(AGL.Texture.loadImage(FOG_DISPLACEMENT_TEXTURE), 10, 0, 0);

    this._filterRenderer = new AGL.FilterRenderer({
      config: {
        context: this._context },

      texture: this._stage2DRendererFramebuffer,
      filters: [
      new AGL.MaskFilter(
      AGL.Texture.loadImage(FOG_MASK_TEXTURE),
      AGL.MaskFilter.Type.RED),

      this._displacementFilter] });


    this._filterRenderer.clearColor.set(0, 0, 0, 0);
    this._filterRenderer.clearBeforeRender = true;

    this.image = new AGL.Image(this._filterRendererFramebuffer);

    this._moveTarget = AGL.Point.create(0, 0);
  }

  setSize(w, h) {
    w *= CONFIG.FOG_SCALE;
    h *= CONFIG.FOG_SCALE;

    this._fogImage.props.width = w;
    this._fogImage.props.height = h;

    this._stage2DRenderer.setSize(w, h);
    this._filterRenderer.setSize(w, h);
  }

  render(delay) {
    const speed = CONFIG.FOG_MOVEMENT * delay;

    this._displacementFilter.x -= speed - this._moveTarget.x;
    this._displacementFilter.y -= speed - this._moveTarget.y;

    this._fogImage.textureProps.x += this._moveTarget.x + speed;
    this._fogImage.textureProps.y += this._moveTarget.y + speed;

    this._stage2DRenderer.renderToFramebuffer(this._stage2DRendererFramebuffer);
    this._filterRenderer.renderToFramebuffer(this._filterRendererFramebuffer);
  }

  move(x, y) {
    this._moveTarget.x = x * CONFIG.FOG_SPEED.X;
    this._moveTarget.y = y * CONFIG.FOG_SPEED.Y;
  }

  destruct() {
    this._stage2DRenderer.destruct();
    this._filterRenderer.destruct();
  }}
;

class Particles extends AGL.Container {
  constructor(textureAtlas) {
    super();

    this.props.x = CONFIG.SCREEN_WIDTH_HALF;
    this.props.y = CONFIG.SCREEN_HEIGHT_HALF;

    this._moveTarget = AGL.Point.create(0, 0);

    this.delay = 1;

    const particleTextureBounds = AGL.Rect.create(
    130 / CONFIG.TEXTURE_SIZE,
    258 / CONFIG.TEXTURE_SIZE,
    146 / CONFIG.TEXTURE_SIZE,
    274 / CONFIG.TEXTURE_SIZE);


    for (let i = 0; i < CONFIG.PARTICLES_NUM; ++i) {
      let particle = new AGL.Image(textureAtlas);
      particle = new AGL.Image();
      particle.props.x = Math.random() * CONFIG.SCREEN_WIDTH;
      particle.props.y = Math.random() * CONFIG.SCREEN_HEIGHT;
      particle.props.width =
      particle.props.height = 1;
      particle.props.anchorX =
      particle.props.anchorY = .5;
      particle.props.alpha = .2 + Math.random() * .3;
      particle.textureCrop.x = particleTextureBounds.x;
      particle.textureCrop.y = particleTextureBounds.y;
      particle.textureCrop.width = particleTextureBounds.width;
      particle.textureCrop.height = particleTextureBounds.height;
      particle.callback = this._update.bind(this);
      particle.direction = Math.random() * Math.PI * 2;
      particle.turningSpeed = (Math.random() - .8) * .02;
      particle.speed = .1 + Math.random() * .1;
      particle.offset = Math.random() * 100;
      this.addChild(particle);
    }
  }

  move(x, y) {
    this._moveTarget.x = x;
    this._moveTarget.y = y;
  }

  _update(item) {
    let props = item.props;

    const speed = item.speed * this.delay;

    item.direction += item.turningSpeed * this.delay;
    props.x += -this._moveTarget.x + Math.sin(item.direction) * speed;
    props.y += -this._moveTarget.y + Math.cos(item.direction) * speed;

    props.rotation = -item.direction + Math.PI;

    if (props.x < -CONFIG.SCREEN_HEIGHT_HALF) props.x += CONFIG.SCREEN_HEIGHT;else
    if (props.x > CONFIG.SCREEN_HEIGHT_HALF) props.x -= CONFIG.SCREEN_HEIGHT;

    if (props.y < -CONFIG.SCREEN_HEIGHT_HALF) props.y += CONFIG.SCREEN_HEIGHT;else
    if (props.y > CONFIG.SCREEN_HEIGHT_HALF) props.y -= CONFIG.SCREEN_HEIGHT;
  }}

    this.heightMapContainer.props.y = CONFIG.SCREEN_HEIGHT_HALF;
    this.heightMapContainer.addChild(this._heightImage);

    this.light = light;
    this.light.props.y = -26;
    this.light.props.z = 102;
    this.light.props.width = 250;
    this.light.transition = 10;
    this.light.angle = 22.5 * AGL.Utils.THETA;
    this.light.props.rotation = -90 * AGL.Utils.THETA;
    this.light.transition = 1;
    this.light.color.set(1, .9, .6, .75);
    this.addChild(this.light);
  }

  get rotation() {
    return this.props.rotation;
  }

  set rotation(v) {
    this.heightMapContainer.props.rotation =
    this.props.rotation = v;
  }

  get lightOn() {
    return this.light.isOn();
  }

  set lightOn(v) {
    this.light.renderable = v;
  }

  get scale() {
    return this.props.scaleX;
  }

  set scale(v) {
    this.heightMapContainer.props.scaleX =
    this.heightMapContainer.props.scaleY =
    this.props.scaleX =
    this.props.scaleY = v;
  }}


class Map {
  constructor(textureAtlas, heightMapTextureAtlas) {
    this._textureAtlas = textureAtlas;
    this._heightMapTextureAtlas = heightMapTextureAtlas;

    this._miniMapContainer = document.querySelector(".mini-map");

    this._canvas = document.createElement("canvas");
    this._context = this._canvas.getContext("2d");

    this._mapItemsParams = [];

    this._mapImage = document.createElement("img");

    this._images = [];

    this._heightMapImages = [];

    this.floorContainer = new AGL.Container();
    this.lightContainer = new AGL.Container();
    this.topContainer = new AGL.Container();
    this.heightMapContainer = new AGL.Container();

    this._createImages();
  }

  load(url, callback) {
    this._onImageLoadBound = this._onImageLoad.bind(this, callback);

    this._mapImage.addEventListener("load", this._onImageLoadBound);
    this._mapImage.src = url;
  }

  destruct() {
    this._miniMapContainer.removeChild(this._miniMapCanvas);

    this._canvas =
    this._context =
    this._mapItemsParams =
    this._mapImage = null;
  }

  _createImages() {
    for (let i = 2; i < CONFIG.CHUNK_HEIGHT; ++i) {
      this._images[i] = [];
      this._heightMapImages[i] = [];
      for (let j = 2; j < CONFIG.CHUNK_WIDTH; ++j) {
        this._images[i][j] = [
        this._createImage(),
        this._createImage()];


        let heightMapFloorImage = this._createImage();
        heightMapFloorImage.texture = this._heightMapTextureAtlas;

        let heightMapModImage = this._createImage();
        heightMapModImage.texture = this._heightMapTextureAtlas;

        this._heightMapImages[i][j] = [
        heightMapFloorImage,
        heightMapModImage];

      }
    }
  }

  isWalkable(x, y) {
    x = Math.floor((x + CONFIG.ITEM_SIZE_HALF) / CONFIG.ITEM_SIZE);
    y = Math.floor((y + CONFIG.ITEM_SIZE_HALF) / CONFIG.ITEM_SIZE);

    let pixelPosition = x + y * CONFIG.MAP_SIZE;

    return pixelPosition > -1 && pixelPosition < this._mapItemsParams.length ?
    this._mapItemsParams[pixelPosition].isWalkable :
    false;
  }

  moveTo(x, y) {
    this.floorContainer.props.x =
    this.topContainer.props.x =
    this.lightContainer.props.x =
    this.heightMapContainer.props.x = -x + CONFIG.SCREEN_WIDTH_HALF;
    this.floorContainer.props.y =
    this.topContainer.props.y =
    this.lightContainer.props.y =
    this.heightMapContainer.props.y = -y + CONFIG.SCREEN_HEIGHT_HALF;

    x = Math.floor(x / CONFIG.ITEM_SIZE);
    y = Math.floor(y / CONFIG.ITEM_SIZE);

    this._miniMapCanvas.style.left = 50 - x + "px";
    this._miniMapCanvas.style.top = 50 - y + "px";

    for (let i = 2; i < CONFIG.CHUNK_HEIGHT; ++i) {
      for (let j = 2; j < CONFIG.CHUNK_WIDTH; ++j) {
        const px = x + j - CONFIG.CHUNK_WIDTH_HALF;
        const py = y + i - CONFIG.CHUNK_HEIGHT_HALF;

        const pixelPosition = (px + py * CONFIG.MAP_SIZE) * 4;

        const floorImage = this._images[i][j][0];

        if (
        pixelPosition > -1 &&
        pixelPosition < this._mapImageData.length &&
        floorImage.pixelPositionId !== pixelPosition)
        {
          floorImage.pixelPositionId = pixelPosition;

          const { rotation, scaleX, scaleY, floorCastShadow, modCastShadow } = this._mapItemsParams[pixelPosition / 4];

          const floorTextureId = this._mapImageData[pixelPosition];
          const modTextureId = this._mapImageData[pixelPosition + 1];
          const textureData = this._mapImageData[pixelPosition + 2];

          const tileX = px * CONFIG.ITEM_SIZE;
          const tileY = py * CONFIG.ITEM_SIZE;

          this._setupImage(
          floorImage,
          this._heightMapImages[i][j][0],
          floorTextureId,
          tileX, tileY,
          rotation,
          scaleX, scaleY,
          floorCastShadow);
          this._setupImage(
          this._images[i][j][1],
          this._heightMapImages[i][j][1],
          modTextureId,
          tileX, tileY,
          rotation,
          scaleX, scaleY,
          modCastShadow);
        }
      }
    }
  }

  _createImage() {
    let image = new AGL.Image();
    image.props.anchorX =
    image.props.anchorY = .5;
    image.props.width =
    image.props.height = CONFIG.ITEM_SIZE;
    image.tintType = AGL.Image.TintType.NORMAL;
    return image;
  }

  _setupImage(image, heightMapImage, textureId, x, y, rotation, scaleX, scaleY, castShadow) {
    if (textureId > 0) {
      const texturePosition = CONFIG.TEXTURE_POSITIONS[textureId];

      const cropX = texturePosition[0];
      const cropY = texturePosition[1];

      image.textureCrop.x = cropX;
      image.textureCrop.y = cropY;
      image.textureCrop.width = cropX + CONFIG.ITEM_TEXTURE_SIZE;
      image.textureCrop.height = cropY + CONFIG.ITEM_TEXTURE_SIZE;
      image.props.scaleX = scaleX;
      image.props.scaleY = scaleY;
      image.props.rotation = rotation;
      image.props.x = x;
      image.props.y = y;

      if (castShadow) {
        heightMapImage.textureCrop.x = image.textureCrop.x;
        heightMapImage.textureCrop.y = image.textureCrop.y;
        heightMapImage.textureCrop.width = image.textureCrop.width;
        heightMapImage.textureCrop.height = image.textureCrop.height;
        heightMapImage.props.scaleX = image.props.scaleX;
        heightMapImage.props.scaleY = image.props.scaleY;
        heightMapImage.props.rotation = image.props.rotation;
        heightMapImage.props.x = image.props.x;
        heightMapImage.props.y = image.props.y;

        image.texture = this._textureAtlas;
        this.heightMapContainer.addChild(heightMapImage);
        this.topContainer.addChild(image);
      } else {
        image.texture = this._textureAtlas;
        this.heightMapContainer.removeChild(heightMapImage);
        this.floorContainer.addChild(image);
      }
    } else {
      this.topContainer.removeChild(image);
      this.floorContainer.removeChild(image);
    }
  }

  _genMiniMap(w, h) {
    this._miniMapCanvas = document.createElement("canvas");
    this._miniMapCanvas.width = w;
    this._miniMapCanvas.height = h;
    this._miniMapContainer.appendChild(this._miniMapCanvas);

    this._miniMapContext = this._miniMapCanvas.getContext("2d");

    let miniMapImageData = this._miniMapContext.getImageData(0, 0, w, h);

    let pixels = miniMapImageData.data;

    for (let i = 0, l = this._mapImageData.length; i < l; i += 4) {
      const textureData = this._mapImageData[i + 2];
      const isWalkable = !enumCheck(textureData, 32);
      pixels[i] =
      pixels[i + 1] =
      pixels[i + 2] = isWalkable ? this._mapImageData[i] * 16 : 0;
      pixels[i + 3] = 255;
      this._mapItemsParams.push({
        isWalkable: isWalkable,
        rotation: (enumCheck(textureData, 4) ?
        90 :

        enumCheck(textureData, 8) ? 180 :

        enumCheck(textureData, 16) ? 270 : 0) *
        AGL.Utils.THETA,
        scaleX: enumCheck(textureData, 1) ? -1 : 1,
        scaleY: enumCheck(textureData, 2) ? -1 : 1,
        floorCastShadow: enumCheck(textureData, 64),
        modCastShadow: enumCheck(textureData, 128) });

    }

    this._miniMapContext.putImageData(miniMapImageData, 0, 0);
    this._miniMapContext = null;
  }

  _onImageLoad(callback) {
    this._mapImage.removeEventListener("load", this._onImageLoadBound);

    const w = this._mapImage.naturalWidth;
    const h = this._mapImage.naturalHeight;

    this._canvas.width = w;
    this._canvas.height = h;

    this._context.drawImage(this._mapImage, 0, 0, w, h);
    this._mapImageData = this._context.getImageData(0, 0, w, h).data;

    this._mapImage =
    this._context =
    this._canvas = null;

    this._genMiniMap(w, h);

    callback();
  }}


class Application {
  constructor() {
    this._onMouseMoveBound = this._onMouseMove.bind(this);
    this._onBeforeUnloadBound = this._onBeforeUnload.bind(this);
    this._onStageResizeBound = this._onStageResize.bind(this);
    this._onSwitchLightBound = this._onSwitchLight.bind(this);

    this._init(AGL.Point.create(CONFIG.START_DATA.X, CONFIG.START_DATA.Y));
  }

  _init(startPoint) {
    this._destruct();

    this._inited = true;

    this._stageContainer = document.querySelector(".container");

    this._context = new AGL.Context();

    this._topRendererFramebuffer = new AGL.Framebuffer();
    this._stage2DRendererFramebuffer = new AGL.Framebuffer();
    this._heightMapRendererFramebuffer = new AGL.Framebuffer();

    this._topRenderer = new AGL.Stage2D({
      config: {
        context: this._context,
        contextAttributes: {
          alpha: true } },


      maxBatchItems: CONFIG.CHUNK_WIDTH * CONFIG.CHUNK_HEIGHT * 2 + 1 });

    this._topRenderer.clearColor.set(0, 0, 0, 0);
    this._topRenderer.clearBeforeRender = true;

    this._heightMapRenderer = new AGL.Stage2D({
      config: {
        context: this._context,
        contextAttributes: {
          alpha: true } },


      maxBatchItems: CONFIG.CHUNK_WIDTH * CONFIG.CHUNK_HEIGHT * 2 + 1 });

    this._heightMapRenderer.clearColor.set(0, 0, 0, 0);
    this._heightMapRenderer.clearBeforeRender = true;

    this._stage2DRenderer = new AGL.Stage2D({
      config: {
        context: this._context },

      maxBatchItems: CONFIG.CHUNK_WIDTH * CONFIG.CHUNK_HEIGHT * 2 + 503 });

    /*
    this._stage2DRenderer.container.props.scaleX =
    this._stage2DRenderer.container.props.scaleY = .5;
    this._stage2DRenderer.container.props.anchorX = -CONFIG.SCREEN_WIDTH_HALF;
    this._stage2DRenderer.container.props.anchorY = -CONFIG.SCREEN_HEIGHT_HALF;
    */
    this._filterRenderer = new AGL.FilterRenderer({
      config: {
        context: this._context },

      texture: this._stage2DRendererFramebuffer,
      filters: [
      new AGL.BrightnessContrastFilter(.07, 1.22),
      new AGL.SharpenFilter(1.5),
      new AGL.GlowFilter(.8, .8, .1),
      new AGL.VignetteFilter(1, 3, 1, 0, 0, 0),
      new AGL.TintFilter(.2, .5, .7, 1)] });


    this._stageContainer.appendChild(this._context.canvas);

    this._screenScale = new AGL.Point.create(1, 1);
    this._screenPosition = AGL.Point.create();
    this._mousePosition = AGL.Point.create();

    this._stageResizeId = 1;
    this._currentResizeId = 0;

    const textureAtlas = AGL.Texture.loadImage(ENVIRONMENT_TEXTURE);
    const heightMapTextureAtlas = AGL.Texture.loadImage(ENVIRONMENT_HEIGHT_MAP_TEXTURE);

    const topImage = new AGL.Image(this._topRendererFramebuffer);

    this._shadowRenderer = new AGL.SmoothLight({
      config: {
        context: this._context },

      lightNum: CONFIG.LIGHT_NUM * CONFIG.LIGHT_NUM + 2,
      scale: CONFIG.SHADOW_SCALE,
      blur: CONFIG.SHADOW_BLUR,
      heightMap: this._heightMapRendererFramebuffer });

    this._shadowRenderer.image.props.alpha = .9;

    this._hero = new Hero(textureAtlas, heightMapTextureAtlas, this._shadowRenderer.lightRenderer.getLight(0));
    this._hero.lightOn = CONFIG.START_DATA.IS_LIGHT_ON;
    this._hero.rotation = CONFIG.START_DATA.ROTATION;

    this._fogRenderer = new FogRenderer(this._context);

    topImage.props.width =
    this._fogRenderer.image.props.width =
    this._shadowRenderer.image.props.width = CONFIG.SCREEN_WIDTH;

    topImage.props.height =
    this._fogRenderer.image.props.height =
    this._shadowRenderer.image.props.height = CONFIG.SCREEN_HEIGHT;

    this._context.setCanvasSize(CONFIG.SCREEN_WIDTH, CONFIG.SCREEN_HEIGHT);
    this._fogRenderer.setSize(CONFIG.SCREEN_WIDTH, CONFIG.SCREEN_HEIGHT);
    this._topRenderer.setSize(CONFIG.SCREEN_WIDTH, CONFIG.SCREEN_HEIGHT);
    this._heightMapRenderer.setSize(CONFIG.SCREEN_WIDTH, CONFIG.SCREEN_HEIGHT);
    this._shadowRenderer.setSize(CONFIG.SCREEN_WIDTH, CONFIG.SCREEN_HEIGHT);
    this._stage2DRenderer.setSize(CONFIG.SCREEN_WIDTH, CONFIG.SCREEN_HEIGHT);
    this._filterRenderer.setSize(CONFIG.SCREEN_WIDTH, CONFIG.SCREEN_HEIGHT);

    this._renderBound = this._render.bind(this);
    this._requestAnimationFrameId;

    this._map = new Map(textureAtlas, heightMapTextureAtlas);

    this._particles = new Particles(textureAtlas);

    this._stage2DRenderer.container.addChild(this._map.lightContainer);
    this._stage2DRenderer.container.addChild(this._map.floorContainer);
    this._stage2DRenderer.container.addChild(topImage);
    this._stage2DRenderer.container.addChild(this._particles);
    this._stage2DRenderer.container.addChild(this._shadowRenderer.image);
    this._stage2DRenderer.container.addChild(this._fogRenderer.image);

    this._topRenderer.container.addChild(this._map.topContainer);
    this._topRenderer.container.addChild(this._hero);

    this._heightMapRenderer.container.addChild(this._map.heightMapContainer);
    this._heightMapRenderer.container.addChild(this._hero.heightMapContainer);

    let ambientLight = this._shadowRenderer.lightRenderer.getLight(1);
    ambientLight.type = AGL.Light.Type.AMBIENT;
    ambientLight.props.z = 512;
    ambientLight.props.width = 100;
    ambientLight.props.rotation = 0 * AGL.Utils.THETA;
    ambientLight.precision = 64;
    ambientLight.transition = 2;
    ambientLight.color.set(.2, .6, .9, .2);
    this._map.lightContainer.addChild(ambientLight);

    const lightCallbackBound = this._lightCallback.bind(this);

    const pos = CONFIG.ITEM_SIZE * CONFIG.MAP_SIZE / CONFIG.LIGHT_NUM;
    for (let i = 0; i < CONFIG.LIGHT_NUM; ++i) {
      for (let j = 0; j < CONFIG.LIGHT_NUM; ++j) {
        let light = this._shadowRenderer.lightRenderer.getLight(2 + (i * CONFIG.LIGHT_NUM + j));
        light.props.x = i * pos;
        light.props.y = j * pos;
        light.props.width = 450;
        light.props.z = 375;
        light.precision = 80;
        light.transition = 1;
        light.spotAngle = 70 * AGL.Utils.THETA;
        light.callback = lightCallbackBound;
        light.color.set(1, .9568, .4901, 1);
        this._map.lightContainer.addChild(light);
      }
    }

    window.addEventListener("mousemove", this._onMouseMoveBound);
    window.addEventListener("beforeunload", this._onBeforeUnloadBound);
    window.addEventListener("resize", this._onStageResizeBound);
    window.addEventListener("click", this._onSwitchLightBound);

    this._heroPosition = startPoint;
    this._keyboard = new Keyboard();

    this._map.load(MAP_TEXTURE, this._onMapLoaded.bind(this));
  }

  _lightCallback(light) {
    light.renderable = Math.abs(light.props.x - this._heroPosition.x) < CONFIG.SCREEN_WIDTH_HALF + light.props.width &&
    Math.abs(light.props.y - this._heroPosition.y) < CONFIG.SCREEN_HEIGHT_HALF + light.props.height;
  }

  _onMapLoaded() {
    this._map.moveTo(this._heroPosition.x, this._heroPosition.y);

    AGL.FPS.start(60);
    this._requestAnimationFrameId = requestAnimationFrame(this._renderBound);
  }

  _onSwitchLight() {
    this._hero.lightOn = !this._hero.lightOn;
  }

  _onMouseMove() {
    this._mousePosition.x = (event.clientX - this._screenPosition.x) * this._screenScale.x;
    this._mousePosition.y = (event.clientY - this._screenPosition.y) * this._screenScale.y;

    this._hero.rotation = Math.atan2(
    this._mousePosition.x - this._hero.props.x,
    this._hero.props.y - this._mousePosition.y);

  }

  _render() {
    if (this._requestAnimationFrameId) {
      AGL.FPS.update();
      let delay = AGL.FPS.delay;

      if (AGL.FPS.fps < 50) this._shadowRenderer.scale = Math.max(.25, this._shadowRenderer.scale - .005);else
      if (AGL.FPS.fps > 55) this._shadowRenderer.scale = Math.min(1, this._shadowRenderer.scale + .005);

      this._resize();
      this._movement(delay);

      this._particles.delay = delay;
      this._fogRenderer.render(delay);
      this._topRenderer.renderToFramebuffer(this._topRendererFramebuffer);
      this._heightMapRenderer.renderToFramebuffer(this._heightMapRendererFramebuffer);
      this._shadowRenderer.render();
      this._stage2DRenderer.renderToFramebuffer(this._stage2DRendererFramebuffer);
      this._filterRenderer.render();

      this._requestAnimationFrameId = requestAnimationFrame(this._renderBound);
    } else this._init(this._heroPosition);
  }

  _movement(delay) {
    let horizontalMovement = 0;
    let verticalMovement = 0;

    const speed = delay * CONFIG.SPEED;

    this._keyboard.isPressed(CONFIG.KEYS.RIGHT) && (horizontalMovement = speed);
    this._keyboard.isPressed(CONFIG.KEYS.LEFT) && (horizontalMovement = -speed);
    this._keyboard.isPressed(CONFIG.KEYS.UP) && (verticalMovement = -speed);
    this._keyboard.isPressed(CONFIG.KEYS.DOWN) && (verticalMovement = speed);

    if (horizontalMovement !== 0 || verticalMovement !== 0) {
      if (horizontalMovement !== 0 && verticalMovement !== 0) {
        horizontalMovement *= 0.7;
        verticalMovement *= 0.7;
      }

      if (
      this._map.isWalkable(
      this._heroPosition.x + Math.sign(horizontalMovement) * 10,
      this._heroPosition.y + Math.sign(verticalMovement) * 10))

      {
        this._heroPosition.x += horizontalMovement;
        this._heroPosition.y += verticalMovement;
        this._map.moveTo(Math.floor(this._heroPosition.x), Math.floor(this._heroPosition.y));
      } else {
        horizontalMovement =
        verticalMovement = 0;
      }
    }

    this._fogRenderer.move(horizontalMovement, verticalMovement);
    this._particles.move(horizontalMovement, verticalMovement);

    this._hero.scale = 1 + (Math.sin(this._heroPosition.x * .1) + Math.sin(this._heroPosition.y * .1)) * .05;
  }

  _resize() {
    if (this._currentResizeId < this._stageResizeId) {
      this._currentResizeId = this._stageResizeId;

      const screenWidth = document.body.offsetWidth;
      const screenHeight = document.body.offsetHeight;

      const containerWidth = this._stageContainer.offsetWidth;
      const containerHeight = this._stageContainer.offsetHeight;

      this._screenScale.x = CONFIG.SCREEN_WIDTH / containerWidth;
      this._screenScale.y = CONFIG.SCREEN_HEIGHT / containerHeight;

      this._screenPosition.x = (screenWidth - containerWidth) * .5;
      this._screenPosition.y = (screenHeight - containerHeight) * .5;
    }
  }

  _onStageResize() {
    ++this._stageResizeId;
  }

  _destruct() {
    if (!this._inited) return;

    cancelAnimationFrame(this._requestAnimationFrameId);

    window.removeEventListener("mousemove", this._onMouseMoveBound);
    window.removeEventListener("beforeunload", this._onBeforeUnloadBound);
    window.removeEventListener("resize", this._onStageResizeBound);
    window.removeEventListener("click", this._onSwitchLightBound);

    this._stageContainer.removeChild(this._context.canvas);

    this._map.destruct();
    this._keyboard.destruct();
    this._fogRenderer.destruct();
    this._topRenderer.destruct();
    this._heightMapRenderer.destruct();
    this._shadowRenderer.destruct();
    this._stage2DRenderer.destruct();
    this._filterRenderer.destruct();
  }

  _onBeforeUnload() {
    this._destruct();
  }}


console.clear();
AGL.Utils.initApplication(function (isWebGl2Supported) {
  const startButton = document.querySelector(".start-button");

  if (!isWebGl2Supported) {
    startButton.textContent = "WebGl2 is not supported :(";
    return;
  }

  new Application();

  startButton.textContent = "START";
});
</script>
