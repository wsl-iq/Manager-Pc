<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد كلمات مرور عشوائي</title>
    <style>
        body {
            font-family: "Courier New", Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
        }
        h2 {
            margin-bottom: 20px;
        }
        .checkbox-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
        }
        input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }
        .password {
            font-size: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 20px;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }
        button, a {
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover, a:hover {
            background-color: #0056b3;
        }
        .about, .home {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="home" class="home">
            <h2>مولد كلمات مرورعشوائية</h2>
            <div class="checkbox-group">
                <label><input type="checkbox" id="uppercase" checked> ABC</label>
                <label><input type="checkbox" id="lowercase" checked> abc</label>
                <label><input type="checkbox" id="numbers" checked> 123</label>
                <label><input type="checkbox" id="symbols" checked> !@#$%&*</label>
            </div>
            <input type="range" id="lengthSlider" min="4" max="25" value="12">
            <p>طول كلمة المرور : <span id="lengthValue">12</span></p>
            <div class="password" id="passwordDisplay">ستظهر كلمة المرور الخاصة بك هنا</div>
            <button onclick="generatePassword()">إنشاء كلمة المرور</button>
            <button onclick="showSection('about')">حول المطور</button>
        </div>

        <div id="about" class="about">
            <h2>نبذة عني و حول البرنامج</h2>
            <p>مرحباً بكم في برنامجي</p>
            <p>الهدف هو إنشاء كلمات مرور عشوائية</p>
            <p>والتي من الصعب اختراقها لأنها تتكون من</p>
            <p>كلمات كبيرة وصغيرة وأرقام ورموز نصية</p>
            <p>مع تحياتي المطور : محمد الباقر</p>
            <button onclick="showSection('home')">رجوع</button>
        </div>
    </div>

    <script>
        const uppercase = 'QWERTYUIOPASDFGHJKLZXCVBNM';
        const lowercase = 'qwertyuiopasdfghjklzxcvbnm';
        const numbers = '1234567890';
        const symbols = '!@#$%^&*';

        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const passwordDisplay = document.getElementById('passwordDisplay');

        lengthSlider.addEventListener('input', () => {
            lengthValue.textContent = lengthSlider.value;
        });

        function generatePassword() {
            let charset = '';
            if (document.getElementById('uppercase').checked) charset += uppercase;
            if (document.getElementById('lowercase').checked) charset += lowercase;
            if (document.getElementById('numbers').checked) charset += numbers;
            if (document.getElementById('symbols').checked) charset += symbols;

            let password = '';
            for (let i = 0; i < lengthSlider.value; i++) {
                const randomIndex = Math.floor(Math.random() * charset.length);
                password += charset[randomIndex];
            }
            passwordDisplay.textContent = password;
        }

        function showSection(section) {
            document.getElementById('home').style.display = 'none';
            document.getElementById('about').style.display = 'none';
            document.getElementById(section).style.display = 'block';
        }

        showSection('home');
    </script>
</body>
</html>
